    right_arm_elbow_joint: {p: 2000,  d: 20, i: 1, i_clamp: 1}
    right_arm_wrist_1_joint: {p: 500,  d: 1, i: 1, i_clamp: 1}
    right_arm_wrist_2_joint: {p: 500,  d: 1, i: 1, i_clamp: 1}
    right_arm_wrist_3_joint: {p: 10,  d: 0.1, i: 0, i_clamp: 1} 
  constraints:
    goal_time: 0.6
