# HSV thresholds for the red block. The value/saturation floor rejects brown cardboard
# and dark printed text that previously won by area.
red_low_1: [0, 100, 50]
red_high_1: [12, 255, 255]
red_low_2: [168, 100, 50]
red_high_2: [180, 255, 255]

# Only search the physical pick area in the fixed RealSense image.
use_roi: true
roi_x_min: 0
roi_y_min: 0
roi_x_max: 640
roi_y_max: 480

# Reject small reflections, long printed text regions, and oversized red patches.
min_area_pixels: 800
max_area_pixels: 12000
min_bbox_width_pixels: 25
max_bbox_width_pixels: 130
min_bbox_height_pixels: 25
max_bbox_height_pixels: 160
min_aspect_ratio: 0.35
max_aspect_ratio: 1.8
min_fill_ratio: 0.45

# Median depth is sampled around the detected center.
depth_window_pixels: 7

# RViz visualization cloud for the selected red object only.
max_cloud_points: 3000
