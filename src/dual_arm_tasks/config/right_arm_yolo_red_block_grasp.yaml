# Right-arm YOLO red-block grasp. YOLO finds the red block; fixed successful
# TCP geometry defines the safe grasp height, posture, and place/retreat poses.

enabled: true

model_path: /home/gzu/gzu_ws/src/ultralytics_ros/models/red_block.pt
target_frame: right_arm_base
color_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
output_topic: /yolo_red_block/point_base
point_camera_topic: /yolo_red_block/point_camera
pixel_topic: /yolo_red_block/pixel
debug_image_topic: /yolo_red_block/image
debug_image_path: /tmp/yolo_red_block_debug.jpg

# Public colored-block datasets commonly use one of these labels.
class_names: ["red", "red cube", "red_block", "red block"]
class_ids: []
conf_thres: 0.35
iou_thres: 0.45
min_red_score: 0.08
imgsz: 640
device: cpu
max_rate: 5.0
depth_window_pixels: 9
min_depth_m: 0.05
max_depth_m: 1.50
min_depth_samples: 20
max_depth_age_sec: 1.0
use_plane_if_depth_missing: true
table_z: 0.312
block_height: 0.03
z_offset: 0.0

yolo_point_topic: /yolo_red_block/point_base
target_sample_count: 5
target_timeout: 8.0
target_max_spread: 0.008

arm_group: right_arm
planning_frame: right_arm_base
end_effector_link: right_arm_tool0
pose_target_is_tcp: true
tcp_offset_from_end_effector: [0.0, 0.0, 0.155]
use_joint_targets_from_ik: true
ik_timeout: 1.0
avoid_collisions: true

gripper_mode: robotiq_topic
gripper_topic: /right_arm/Robotiq2FGripperRobotOutput
open_position: 0
close_position: 255
gripper_speed: 80
gripper_force: 80
gripper_settle_seconds: 1.0

velocity_scaling: 0.03
acceleration_scaling: 0.03
planning_time: 20.0
orientation_rpy: [-3.1416, 0.0, -1.5708]
robot_program_topic: /right_arm/ur_hardware_interface/robot_program_running

# Initial bias derived from the successful object_1 fixed grasp:
# fixed TCP grasp [-0.075, 0.417, 0.369] minus stable camera-derived object point
# around [-0.0176, 0.4573, 0.3940]. Re-tune after the first YOLO debug image if
# the public model's box center differs from the color-segmented center.
yolo_point_to_grasp_bias_base: [-0.0574, -0.0403, -0.0250]
use_fixed_grasp_z: true
fixed_grasp_z: 0.369

# Preserve the same local TCP approach/lift vector as the proven fixed grasp.
pre_grasp_delta_from_grasp: [-0.029, -0.033, -0.043]
lift_delta_from_grasp: [-0.029, -0.033, -0.043]

# Conservative right-table grasp region. If YOLO sees a red object outside this
# box, the node refuses to move.
safe_grasp_bounds:
  x: [-0.300, 0.050]
  y: [0.300, 0.560]
  z: [0.355, 0.385]
safe_pre_grasp_bounds:
  x: [-0.330, 0.030]
  y: [0.260, 0.540]
  z: [0.310, 0.350]
safe_lift_bounds:
  x: [-0.330, 0.030]
  y: [0.260, 0.540]
  z: [0.310, 0.350]

# Keep the robot near the table workflow. Set go_home_first true only when the
# current pose is not already in a safe approach state.
go_home_first: false
go_retreat: true
go_home_after: true

poses:
  home:
    translation: [-0.532, -0.054, 0.500]
    quaternion: [-0.513, 0.505, 0.693, -0.046]
    rpy_radian: [1.619, 0.725, -2.250]
    rpy_degree: [92.788, 41.560, -128.908]

  pre_grasp:
    translation: [-0.104, 0.384, 0.326]
    quaternion: [-0.140, 0.352, 0.365, 0.850]
    rpy_radian: [0.026, 0.777, 0.822]
    rpy_degree: [1.484, 44.546, 47.086]

  grasp:
    translation: [-0.075, 0.417, 0.369]
    quaternion: [-0.143, 0.372, 0.312, 0.862]
    rpy_radian: [-0.023, 0.820, 0.683]
    rpy_degree: [-1.308, 47.009, 39.156]

  lift:
    translation: [-0.104, 0.384, 0.326]
    quaternion: [-0.140, 0.352, 0.365, 0.850]
    rpy_radian: [0.026, 0.777, 0.822]
    rpy_degree: [1.484, 44.546, 47.086]

  pre_place:
    translation: [-0.298, 0.265, 0.471]
    quaternion: [-0.130, 0.358, 0.352, 0.855]
    rpy_radian: [0.042, 0.781, 0.799]
    rpy_degree: [2.410, 44.741, 45.794]

  place:
