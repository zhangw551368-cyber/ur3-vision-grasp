# Right-arm ArUco cube pick using camera2 as an eye-on-base sensor.
# Default is safe plan-only. Execute only after checking the detected pose in RViz.

enabled: true

arm_group: right_arm
planning_frame: right_arm_base
end_effector_link: right_arm_tool0

pose_target_is_tcp: true
tcp_offset_from_end_effector: [0.0, 0.0, 0.155]
use_joint_targets_from_ik: true
ik_timeout: 1.0
avoid_collisions: true

gripper_mode: robotiq_topic
gripper_topic: /right_arm/Robotiq2FGripperRobotOutput
open_position: 0
close_position: 255
gripper_speed: 40
gripper_force: 45
gripper_settle_seconds: 1.0

velocity_scaling: 0.010
acceleration_scaling: 0.010
planning_time: 20.0
orientation_rpy: [-3.1416, 0.0, -1.5708]
max_joint_delta_before_execute: 1.600
max_wrist_joint_delta_before_execute: 0.600
min_end_effector_z_before_execute: 0.350

robot_program_topic: /right_arm/ur_hardware_interface/robot_program_running

visual_aruco:
  use_opencv_detection: false
  marker_id: 0
  aruco_dictionary: DICT_4X4_50
  image_topic: /camera2/color/image_raw
  depth_topic: /camera2/aligned_depth_to_color/image_raw
  camera_info_topic: /camera2/color/camera_info_calibrated
  camera_frame: camera2_color_optical_frame
  base_frame: right_arm_base
  aruco_pose_topic: /camera2_aruco_cube/center_pose_base
  detected_pose_topic: /camera2_aruco_cube/grasp_center_pose_base
  use_frozen_pose: false
  frozen_center_base: null
  visual_compensation_mode: absolute_offset
  aruco_to_grasp_offset: [0.0, 0.0, 0.0]

  # Sample the static cube center once at the start of each run while camera2 is unobstructed.
  # The sampled pose is then used as the fixed target for that run.
  # The localization node publishes the 55 mm cube center in right_arm_base.
  # Marker metadata is kept here for reference and for the separate localization launch.
  object_size: [0.055, 0.055, 0.055]
  marker_to_object_center: [0.0, 0.0, -0.0275]

  pre_grasp_lift: 0.120
  lift_height: 0.120
  geometry_approach_vector: [0.0, 0.0, 0.120]
  geometry_lift_vector: [0.0, 0.0, 0.120]
  geometry_orientation_source: grasp
  aruco_sample_count: 8
  aruco_pose_timeout: 20.0
  target_max_spread: 0.006
  detection_scale: 2.0
  depth_window: 11
  min_depth: 0.05
  max_depth: 1.50
require_grasp_detection: true
stop_after_lift: true
gripper_status_topic: /right_arm/Robotiq2FGripperRobotInput

