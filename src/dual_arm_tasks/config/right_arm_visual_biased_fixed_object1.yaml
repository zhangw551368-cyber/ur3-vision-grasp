# Right-arm object_1 fixed TCP trajectory with eye-in-hand visual XY bias correction.
# The fixed poses are the previously successful right_arm_tool0_controller/TCP poses.

enabled: true

arm_group: right_arm
planning_frame: right_arm_base
end_effector_link: right_arm_tool0

pose_target_is_tcp: true
tcp_offset_from_end_effector: [0.0, 0.0, 0.155]
use_joint_targets_from_ik: true
ik_timeout: 1.0
avoid_collisions: true

gripper_mode: robotiq_topic
gripper_topic: /right_arm/Robotiq2FGripperRobotOutput
open_position: 0
close_position: 255
gripper_speed: 80
gripper_force: 80
gripper_settle_seconds: 1.0

velocity_scaling: 0.03
acceleration_scaling: 0.03
planning_time: 20.0
orientation_rpy: [-3.1416, 0.0, -1.5708]

robot_program_topic: /right_arm/ur_hardware_interface/robot_program_running
vision_target_topic: /red_block/point_base

# Captured at the current object_1 placement before execution on 2026-06-10.
# The detector point is not the TCP grasp point; it is used only as a repeatable
# visual reference for small XY shifts on the table.
vision_reference_pose: grasp
vision_reference_point: [-0.017598, 0.457252, 0.393960]
apply_visual_delta_axes: [true, true, false]
max_visual_delta: [0.060, 0.060, 0.005]
shift_visual_pose_names: [pre_grasp, grasp, lift]
target_sample_count: 5
target_timeout: 8.0
target_max_spread: 0.005

