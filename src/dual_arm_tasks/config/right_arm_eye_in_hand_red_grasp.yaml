# Eye-in-hand RealSense primary red-block grasp parameters.

target_frame: right_arm_base
color_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
output_topic: /red_block/point_base
use_plane_if_depth_missing: false

red_low_1: [0, 100, 50]
red_high_1: [12, 255, 255]
red_low_2: [168, 100, 50]
red_high_2: [180, 255, 255]

use_roi: false
roi_x_min: 0
roi_y_min: 0
roi_x_max: 0
roi_y_max: 0
min_area_pixels: 500
max_area_pixels: 80000
min_aspect_ratio: 0.2
max_aspect_ratio: 4.0
min_fill_ratio: 0.30
depth_window_pixels: 9
min_depth_m: 0.05
max_depth_m: 1.50

arm_group: right_arm
planning_frame: right_arm_base
robot_effector_frame: right_arm_tcp
moveit_end_effector_link: right_arm_tool0
allow_tcp_offset_planning: true
tcp_frame: right_arm_tcp
fallback_tcp_frame: ""
tcp_offset_from_effector: [0.0, 0.0, 0.155]

# Keep this at the same grasp posture used in the previous right-arm red-block
# tests unless a new observation/grasp posture is deliberately taught.
orientation_quaternion: [-0.5, 0.5, 0.5, 0.5]

# Measure table_z with: rosrun tf tf_echo right_arm_base right_arm_tcp
# when TCP lightly touches the green conveyor/table surface.
table_z: 0.59
block_height: 0.03
height_reference_mode: detected
pre_grasp_height: 0.08
# Current side-grasp posture can Cartesian-lift about 6 cm from this pose.
# Increase after RViz/real-motion checks if the workspace allows it.
lift_height: 0.06
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0

move_to_observe_first: false
observe_pose_name: ""
observe_joint_values: []
test_only_pregrasp: true
enable_second_view_correction: true

target_sample_count: 5
target_timeout: 8.0
target_max_spread: 0.015
pause_before_descent: 0.0

velocity_scaling: 0.05
acceleration_scaling: 0.05
planning_time: 10.0
num_planning_attempts: 10
goal_position_tolerance: 0.01
goal_orientation_tolerance: 0.08
cartesian_step: 0.005
cartesian_min_fraction: 0.995

gripper_topic: /right_arm/Robotiq2FGripperRobotOutput
robot_program_topic: /right_arm/ur_hardware_interface/robot_program_running
open_position: 0
close_position: 210
gripper_speed: 80
gripper_force: 80
gripper_settle_seconds: 1.0
