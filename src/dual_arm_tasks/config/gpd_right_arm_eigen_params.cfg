# GPD CPU/Eigen configuration for the right-arm RealSense + Robotiq 2F setup.
# Units are meters. Tune workspace values after checking the live point cloud frame.

# Path to config file for robot hand geometry.
hand_geometry_filename = 0

# Path to config file for volume and image geometry.
image_geometry_filename = 0

# ==== Robot Hand Geometry ====
# outer_diameter = max_aperture + 2 * finger_width.
finger_width = 0.01
hand_outer_diameter = 0.105
hand_depth = 0.06
hand_height = 0.02
init_bite = 0.01

# ==== Grasp Descriptor ====
volume_width = 0.10
volume_depth = 0.06
volume_height = 0.02
image_size = 60
image_num_channels = 15

# CPU/Eigen classifier weights bundled with GPD.
weights_file = /home/gzu/gzu_ws/src/gpd/models/lenet/15channels/params/

# ==== Point Cloud Preprocessing ====
# For a RealSense optical frame, x is image-right, y is image-down, z is forward.
voxelize = 1
remove_outliers = 1
workspace = -0.35 0.35 -0.30 0.30 0.15 0.90
camera_position = 0 0 0
sample_above_plane = 1

# ==== Candidate Generation ====
num_samples = 400
num_threads = 4
nn_radius = 0.01
num_orientations = 8
num_finger_placements = 10
hand_axes = 2
deepen_hand = 1

# ==== Candidate Filtering ====
min_aperture = 0.0
max_aperture = 0.085
workspace_grasps = -0.30 0.30 -0.25 0.25 0.20 0.80

# Keep all approach directions in the first run; filter later after viewing RViz.
filter_approach_direction = 0
direction = 1 0 0
thresh_rad = 2.0

# ==== Grasp Selection ====
min_inliers = 1
num_selected = 50

# ==== Visualization ====
plot_normals = 0
plot_samples = 0
plot_candidates = 0
plot_filtered_candidates = 0
plot_valid_grasps = 0
plot_clustered_grasps = 0
plot_selected_grasps = 1
