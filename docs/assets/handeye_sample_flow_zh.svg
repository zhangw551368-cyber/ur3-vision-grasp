<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">手眼标定训练集和验证集采集流程</title>
  <desc id="desc">从安装标定板、稳定检测、采集训练姿态、SE3 优化到独立验证和选择运行结果的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1500" height="560" rx="26" fill="url(#bg)"/>
  <text x="55" y="62" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#0f172a">训练姿态、独立验证姿态与结果选择</text>
  <text x="55" y="98" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#475569">这里的“训练集”是 TF 变换对，不是神经网络图像数据集</text>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 150)"><rect width="220" height="150" rx="20" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="35" cy="35" r="20" fill="#2563eb"/><text x="35" y="42" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="72" y="42" font-size="22" font-weight="700" fill="#0f172a">准备系统</text><text x="25" y="82" font-size="17" fill="#475569">固定相机</text><text x="25" y="110" font-size="17" fill="#475569">标定板刚性安装</text><text x="25" y="138" font-size="17" fill="#475569">校验内参与 TF</text></g>
    <g transform="translate(350 150)"><rect width="220" height="150" rx="20" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="35" cy="35" r="20" fill="#2563eb"/><text x="35" y="42" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="72" y="42" font-size="22" font-weight="700" fill="#0f172a">检测标定板</text><text x="25" y="82" font-size="17" fill="#475569">角点与坐标轴稳定</text><text x="25" y="110" font-size="17" fill="#475569">机械臂完全停止</text><text x="25" y="138" font-size="17" fill="#475569">标定板尽量完整入镜</text></g>
    <g transform="translate(645 150)"><rect width="220" height="150" rx="20" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cx="35" cy="35" r="20" fill="#16a34a"/><text x="35" y="42" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="72" y="42" font-size="22" font-weight="700" fill="#0f172a">训练集 25 组</text><text x="25" y="82" font-size="17" fill="#475569">改变 X/Y/Z 位置</text><text x="25" y="110" font-size="17" fill="#475569">改变滚转/俯仰/偏航</text><text x="25" y="138" font-size="17" fill="#475569">保存 B→E 和 C→T</text></g>
    <g transform="translate(940 150)"><rect width="220" height="150" rx="20" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="35" cy="35" r="20" fill="#7c3aed"/><text x="35" y="42" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="72" y="42" font-size="22" font-weight="700" fill="#0f172a">SE(3) 优化</text><text x="25" y="82" font-size="17" fill="#475569">联合估计 B→C</text><text x="25" y="110" font-size="17" fill="#475569">联合估计 E→T</text><text x="25" y="138" font-size="17" fill="#475569">soft_l1 抑制异常点</text></g>
    <g transform="translate(1235 150)"><rect width="220" height="150" rx="20" fill="#fff" stroke="#ea580c" stroke-width="3"/><circle cx="35" cy="35" r="20" fill="#ea580c"/><text x="35" y="42" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="72" y="42" font-size="22" font-weight="700" fill="#0f172a">独立验证</text><text x="25" y="82" font-size="17" fill="#475569">重新采集 15 + 15 组</text><text x="25" y="110" font-size="17" fill="#475569">不参与优化</text><text x="25" y="138" font-size="17" fill="#475569">比较平移/旋转残差</text></g>
  </g>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M280 225 H340"/><path d="M575 225 H635"/><path d="M870 225 H930"/><path d="M1165 225 H1225"/></g>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <rect x="270" y="370" width="960" height="125" rx="22" fill="#0f172a" opacity="0.94"/>
    <text x="310" y="412" font-size="22" font-weight="700" fill="#fff">结果决策（本次）</text>
    <text x="310" y="451" font-size="19" fill="#cbd5e1">8 月 20 日优化结果在独立验证集上没有稳定优于 8 月 17 日结果</text>
    <text x="310" y="480" font-size="19" font-weight="700" fill="#86efac">因此运行时保留 20260817_safe.launch</text>
  </g>
</svg>
